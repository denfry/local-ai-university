[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-university"
version = "0.0.0"
description = "A local-first autonomous learning agent powered by Ollama that studies computer science, verifies its progress, and builds a visual knowledge graph in Obsidian."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Local AI University contributors" }]
keywords = [
    "ollama",
    "local-llm",
    "ai-agent",
    "autonomous-agents",
    "obsidian",
    "knowledge-graph",
    "education",
    "computer-science",
    "self-learning",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlmodel>=0.0.21",
    "typer>=0.12",
    "rich>=13.7",
    "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aiu = "aiu.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["aiu"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
